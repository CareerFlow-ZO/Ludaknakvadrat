<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">LNK-DIGITAL</title>
  <desc id="desc">Premium metallic cyan violet LNK-DIGITAL logo</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#202227"/>
      <stop offset="0.46" stop-color="#111317"/>
      <stop offset="1" stop-color="#08090b"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.24" stop-color="#eef4f8"/>
      <stop offset="0.48" stop-color="#9aa9b6"/>
      <stop offset="0.72" stop-color="#f8fbfd"/>
      <stop offset="1" stop-color="#8998a5"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63f4ff"/>
      <stop offset="0.36" stop-color="#10c8ff"/>
      <stop offset="0.68" stop-color="#5268ff"/>
      <stop offset="1" stop-color="#b02cff"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cf6ff"/>
      <stop offset="0.28" stop-color="#15d9ff"/>
      <stop offset="0.55" stop-color="#5e63ff"/>
      <stop offset="0.78" stop-color="#9b3cff"/>
      <stop offset="1" stop-color="#d331ff"/>
    </linearGradient>
    <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.55  0 0 0 0 1  0 0 0 1 0" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.72"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="500" cy="500" r="410" fill="#0b0d10" stroke="#23272d" stroke-width="34" filter="url(#shadow)"/>
  <circle cx="500" cy="500" r="423" fill="none" stroke="url(#rim)" stroke-width="13" filter="url(#blueGlow)"/>
  <circle cx="500" cy="500" r="395" fill="none" stroke="#bfeeff" stroke-opacity="0.38" stroke-width="2"/>
  <circle cx="500" cy="500" r="438" fill="none" stroke="#923cff" stroke-opacity="0.28" stroke-width="2"/>

  <!-- metallic L -->
  <path d="M240 350h82v270h150v82H240z" fill="url(#silver)" stroke="#eaf7ff" stroke-width="2" filter="url(#softGlow)"/>
  <path d="M322 620l76 82h74l-74-82z" fill="#526474" opacity="0.9"/>

  <!-- metallic N with electric-blue diagonal -->
  <path d="M410 350h72l168 245v107h-76L410 470z" fill="url(#silver)" stroke="#effaff" stroke-width="2"/>
  <path d="M410 350l240 245v107L410 470z" fill="url(#blue)" filter="url(#blueGlow)" opacity="0.98"/>
  <path d="M410 470v232h82V555z" fill="#697887" stroke="#dceaff" stroke-width="2"/>

  <!-- metallic K -->
  <path d="M650 350h82v150l140-150h105L805 525l180 177H873L732 563v139h-82z" fill="url(#silver)" stroke="#eef9ff" stroke-width="2" filter="url(#softGlow)"/>

  <line x1="240" y1="770" x2="325" y2="770" stroke="#58efff" stroke-width="6" stroke-linecap="round" filter="url(#blueGlow)"/>
  <line x1="675" y1="770" x2="760" y2="770" stroke="#42dfff" stroke-width="6" stroke-linecap="round" filter="url(#blueGlow)"/>
  <text x="500" y="795" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="53" font-weight="700" fill="url(#silver)" letter-spacing="13">LNK-DIGITAL</text>
</svg>
