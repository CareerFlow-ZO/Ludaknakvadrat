name: LNK DIGITAL Real Device & Speed QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real_browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned browser test dependencies
        run: |
          node --version
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 lighthouse@12.8.2
          npx playwright install chromium
      - name: Test 5 actual browser viewports and interactive flows
        run: node scripts/live-device-speed.mjs
      - name: Test fully optimized GitHub HEAD locally in real browsers
        shell: bash
        run: |
          mkdir -p qa-report
          python3 -m http.server 4173 --bind 127.0.0.1 > qa-report/local-server.log 2>&1 &
          sleep 2
          LNK_URL=http://127.0.0.1:4173 LNK_EXPECT_OPTIMIZED=1 node scripts/live-device-speed.mjs
          cp qa-report/device-speed.json qa-report/local-optimized-device-speed.json
          node node_modules/lighthouse/cli/index.js http://127.0.0.1:4173/ --only-categories=performance,accessibility,best-practices,seo --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=qa-report/local-lighthouse-mobile.json --quiet
          node node_modules/lighthouse/cli/index.js http://127.0.0.1:4173/ --preset=desktop --only-categories=performance,accessibility,best-practices,seo --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=qa-report/local-lighthouse-desktop.json --quiet
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          for(const mode of ['mobile','desktop']){
            const d=JSON.parse(readFileSync('qa-report/local-lighthouse-'+mode+'.json'));
            const score=Object.fromEntries(Object.entries(d.categories).map(([k,v])=>[k,Math.round(v.score*100)]));
            const a=d.audits;
            console.log('OPTIMIZED_LOCAL_LIGHTHOUSE '+mode+' '+JSON.stringify({score,lcpMs:a['largest-contentful-paint']?.numericValue,fcpMs:a['first-contentful-paint']?.numericValue,tbtMs:a['total-blocking-time']?.numericValue}));
          }
          NODE
      - name: Lighthouse mobile and desktop performance, SEO and accessibility
        if: always()
        shell: bash
        run: |
          mkdir -p qa-report
          if [ ! -d node_modules/lighthouse ]; then
            echo "Lighthouse not installed; previous step failed"
            exit 1
          fi
          node node_modules/lighthouse/cli/index.js https://www.lnkdigital.com/ --only-categories=performance,accessibility,best-practices,seo --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=qa-report/lighthouse-mobile.json --quiet
          node node_modules/lighthouse/cli/index.js https://www.lnkdigital.com/ --preset=desktop --only-categories=performance,accessibility,best-practices,seo --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=qa-report/lighthouse-desktop.json --quiet
          node --input-type=module - <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const r={};
          for(const mode of ['mobile','desktop']){
            const d=JSON.parse(readFileSync('qa-report/lighthouse-'+mode+'.json','utf8'));
            const a=d.audits||{};
            r[mode]={
              scores:Object.fromEntries(Object.entries(d.categories||{}).map(([k,v])=>[k,Math.round(100*(v.score||0))])),
              lcpMs:a['largest-contentful-paint']?.numericValue||null,
              cls:a['cumulative-layout-shift']?.numericValue||null,
              tbtMs:a['total-blocking-time']?.numericValue||null,
              fcpMs:a['first-contentful-paint']?.numericValue||null,
              speedIndexMs:a['speed-index']?.numericValue||null
            };
          }
          writeFileSync('qa-report/lighthouse-summary.json',JSON.stringify(r,null,2));
          console.log('LIGHTHOUSE RESULTS '+JSON.stringify(r));
          for(const mode of ['mobile','desktop']){
            const d=JSON.parse(readFileSync('qa-report/lighthouse-'+mode+'.json','utf8'));
            const ids=(d.categories['best-practices']?.auditRefs||[]).filter(ref=>ref.weight>0);
            const needs=ids.map(ref=>({id:ref.id,score:d.audits?.[ref.id]?.score,title:d.audits?.[ref.id]?.title,details:d.audits?.[ref.id]?.details?.items?.slice(0,3)})).filter(a=>a.score!==null&&a.score<1);
            console.log('LIGHTHOUSE BEST PRACTICES FINDINGS '+mode+' '+JSON.stringify(needs).slice(0,9000));
          }
          NODE
      - name: Upload browser screenshots and performance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lnk-device-speed-qa
          path: qa-report/
          if-no-files-found: warn
          retention-days: 7
