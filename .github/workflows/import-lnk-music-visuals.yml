          test -s assets/music/rodjendan.png
          test -s assets/music/svadba.png
          test -s assets/music/ljubavna.png
          test -s assets/music/godisnjica.png
          test -s assets/music/porodica.png
          test -s assets/music/saljiva.png
          test -s assets/music/raptrap.png
          test -s assets/music/balkanturkey.png
          test -s assets/music/vip.png
      - name: Commit music visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/music
          git commit -m "Add LNK music preview visuals"
          git push origin HEAD:main
