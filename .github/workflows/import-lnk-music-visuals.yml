name: Import LNK music visuals
on:
  push:
    paths:
      - ".github/workflows/import-lnk-music-visuals.yml"
permissions:
  contents: write
jobs:
  import-music:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download music visuals
        run: |
          mkdir -p assets/music
          curl --fail --location --retry 3 --output assets/music/personalizovana.png "https://d2jqrm6oza8nb6.cloudfront.net/datasets/2c32d213-d84b-46c9-8fa9-9a5e7bb27bbd.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOGI5MWMwYTA3ZWQ3ZTI0OSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDUyNTg1Nn0.8bZzxHbo2Y4fLDxQpWSXc6UMN6wFS4X1hfAscPKDuRM"
