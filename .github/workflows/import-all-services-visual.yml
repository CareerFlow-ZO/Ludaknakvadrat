name: Import all services visual
on:
  push:
    paths:
      - ".github/workflows/import-all-services-visual.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download visual
        run: |
          mkdir -p assets/previews
          curl --fail --location --retry 3 --output assets/previews/all-services-v1.png "https://d2jqrm6oza8nb6.cloudfront.net/datasets/59402a0c-77df-4255-8dc5-3ea8f6ae4757.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTA0MDc0NGQ0MGVlNTI1MSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDUzNzAzN30.3hbd9S7H8ka9RF_as9nMy68engEZFWo0QcDbUubXpJs"
          test -s assets/previews/all-services-v1.png
      - name: Commit visual
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/previews/all-services-v1.png
          git commit -m "Add LNK all services visual"
          git push origin HEAD:main
