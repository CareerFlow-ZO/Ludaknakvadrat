name: Import service card visual
on:
  push:
    paths:
      - ".github/workflows/import-service-card-visual.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download visual
        run: |
          mkdir -p assets/previews
          curl --fail --location --retry 3 --output assets/previews/services-signature-v1.png "https://d2jqrm6oza8nb6.cloudfront.net/datasets/4380b504-da80-4e14-911c-abc5b3f8f8e9.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjUxOWNiY2Y3YWE3YzdhNyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDU0MDQ5NX0.imtmbrSjWHe-AaJUc3hWvpTAP2YWnzspPtaHrUq-0mc"
          test -s assets/previews/services-signature-v1.png
      - name: Commit visual
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/previews/services-signature-v1.png
          git commit -m "Add LNK service cards visual"
          git push origin HEAD:main
