name: LNK Optimize Demo Images

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/export-optimized-images.mjs
      - .github/workflows/lnk-optimize-images.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned image converter
        run: npm install --no-save --no-package-lock --ignore-scripts sharp@0.34.4
      - name: Encode responsive WebP from existing approved images
        run: node scripts/export-optimized-images.mjs
