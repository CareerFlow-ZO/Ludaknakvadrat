name: Build temporary LNK portfolio WebP previews
on:
  push:
    branches:
      - perf/lnk-portfolio-webp-20261009
    paths:
      - scripts/generate-lnk-portfolio-webps.py
      - .github/workflows/lnk-portfolio-image-build.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install "Pillow>=10,<13"
      - name: Generate six LNK WebPs without removing PNG sources
        run: python scripts/generate-lnk-portfolio-webps.py
      - name: Commit optimized images to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/previews/beauty.webp assets/previews/beauty-720.webp assets/previews/barbershop.webp assets/previews/barbershop-720.webp assets/previews/auto.webp assets/previews/auto-720.webp
          if git diff --cached --quiet; then
            echo "All variants already match"
          else
            git commit -m "perf(images): add six compressed LNK portfolio WebP files"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
