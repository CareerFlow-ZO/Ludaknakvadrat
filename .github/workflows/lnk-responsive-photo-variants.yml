name: Generate LNK responsive photo variants
on:
  push:
    branches:
      - perf/lnk-responsive-photos-20261009
    paths:
      - scripts/generate-lnk-photo-variants.py
      - .github/workflows/lnk-responsive-photo-variants.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-responsive-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image optimizer
        run: python -m pip install 'Pillow>=10,<13'
      - name: Generate 600px variants only for LNK photo assets
        run: python scripts/generate-lnk-photo-variants.py
      - name: Commit generated variants to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos/*-600.webp
          if git diff --cached --quiet; then
            echo "All LNK photo variants are up-to-date"
          else
            git commit -m "perf(images): add responsive 600px LNK WebP photo variants"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
