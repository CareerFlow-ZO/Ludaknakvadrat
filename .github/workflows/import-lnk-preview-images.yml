name: Import LNK preview images
on:
  push:
    paths:
      - ".github/workflows/import-lnk-preview-images.yml"

permissions:
  contents: write

jobs:
  import-previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download preview images
        run: |
          mkdir -p assets/previews
          curl --fail --location --retry 3 --output assets/previews/barbershop.png "https://d2jqrm6oza8nb6.cloudfront.net/datasets/852f7458-6348-496d-882c-5b147f842b57.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNTZiNTc4ZDFmN2QzNjg1NSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDQ4MzkyMX0.zuwarwRJ00codAnZnkfo-G1-cWXtgeubUQ1raHuHWKQ"
