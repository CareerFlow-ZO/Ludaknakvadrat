          test -s assets/previews/beauty.png
          test -s assets/previews/auto.png
          test -s assets/previews/truck.png
          test -s assets/previews/restaurant.png
          test -s assets/previews/realestate.png
          test -s assets/previews/dental.png
          test -s assets/previews/fitness.png
          test -s assets/previews/ecommerce.png
          test -s assets/previews/business.png
      - name: Commit preview images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/previews
          git commit -m "Add LNK DIGITAL website preview images"
          git push origin HEAD:main
