name: LNK BUSINESS Workspace Security Gate
on:
  push:
    branches:
      - feature/lnk-business-workspace-20261012
    paths:
      - 'lnk-business-app/**'
      - '.github/workflows/lnk-business-workspace-gate.yml'
  workflow_dispatch:
jobs:
  static-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static release gate
        run: node lnk-business-app/scripts/workspace-security-gate.mjs
