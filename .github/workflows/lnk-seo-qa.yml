name: LNK DIGITAL SEO QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate metadata, sitemap, images and preview indexing
        run: node scripts/seo-audit.mjs
      - name: Validate contextual links and market FAQs on all 20 pages
        run: node scripts/seo-content-audit.mjs
      - name: Guard portfolio claims, external scripts and client safety
        run: node scripts/trust-security-audit.mjs
      - name: Check honest social cards and keyboard skip links on every page
        run: node scripts/share-accessibility-audit.mjs
      - name: Validate visitor-to-client brief, language translations and safe contact handoff
        run: node scripts/lnk-conversion-audit.mjs
      - name: Test 10 languages, cards, links and mobile menu
        run: node scripts/i18n-audit.mjs

      - name: Verify language links on all 19 SEO pages
        run: node scripts/secondary-page-language-audit.mjs

  live_sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production sitemap and robots through public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          base="https://www.lnkdigital.com"
          for path in sitemap.xml robots.txt; do
            echo "Testing ${base}/${path}"
            code=$(curl --max-time 25 --retry 2 --retry-all-errors -sSL -o "/tmp/lnk-${path}" -w "%{http_code}" "${base}/${path}")
            echo "HTTP: ${code}"
            test "${code}" = "200" || { echo "Unexpected status for ${path}"; exit 1; }
            wc -c "/tmp/lnk-${path}"
            head -c 190 "/tmp/lnk-${path}"; echo
          done
          grep -q '<urlset' /tmp/lnk-sitemap.xml
          grep -q 'https://www.lnkdigital.com/' /tmp/lnk-sitemap.xml
          count=$(grep -o '<loc>' /tmp/lnk-sitemap.xml | wc -l | tr -d ' ')
          echo "Sitemap URLs: ${count}"
          test "${count}" -eq 20
          grep -q 'Sitemap: https://www.lnkdigital.com/sitemap.xml' /tmp/lnk-robots.txt
          echo "LIVE SITEMAP & ROBOTS PASS"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Crawl all public LNK pages for SEO and indexability
        run: node scripts/live-seo-crawl.mjs
      - name: Test production images, language runtime, domains and Euro Gurman
        run: node scripts/live-production-smoke.mjs
