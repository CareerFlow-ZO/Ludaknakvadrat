<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Euro Gurman | Urejanje malic</title><style>:root{--wine:#6d2928;--cream:#f5efe6;--ink:#201a17}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px Arial,sans-serif}.bar{background:#4b1d1d;color:#fff;padding:18px 6vw;display:flex;justify-content:space-between}.bar a{color:#fff}.wrap{max-width:900px;margin:auto;padding:45px 20px}h1{font:42px Georgia,serif;margin:0 0 8px}.sub{color:#6f655d}.list{display:grid;gap:12px;margin:28px 0}.row{background:#fff;padding:18px;border:1px solid #dfd3c6;display:grid;grid-template-columns:1.2fr 1.8fr .65fr auto;gap:10px;align-items:center}.row input{width:100%;padding:11px;border:1px solid #d5c7b9}.del{border:0;background:#f2e5e3;color:#7b2725;width:38px;height:38px;font-size:18px;cursor:pointer}.add,.save{border:0;padding:14px 20px;font-weight:700;cursor:pointer}.add{background:#fff;color:var(--wine);border:1px solid var(--wine)}.save{background:var(--wine);color:#fff;margin-left:8px}.status{margin-left:10px;color:#467044;font-weight:700}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:20px}.modal.open{display:grid}.box{background:#fff;width:min(520px,100%);padding:25px}.box h2{font:30px Georgia,serif;margin-top:0}.box label{display:block;font-size:11px;font-weight:700;color:var(--wine);margin:12px 0 5px}.box input,.box textarea{width:100%;padding:12px;border:1px solid #d5c7b9}.box textarea{min-height:90px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.cancel{padding:12px 16px;border:1px solid #ccc;background:#fff}.note{margin-top:24px;background:#fff;padding:15px;border-left:4px solid #d8b478;font-size:13px}@media(max-width:700px){.row{grid-template-columns:1fr}.del{justify-self:end}h1{font-size:34px}.save{margin:8px 0 0}}</style></head><body><div class="bar"><b>EURO GURMAN · ADMIN</b><a href="index.html">← Nazaj</a></div><main class="wrap"><h1>Dnevne malice</h1><p class="sub">Dodate lahko največ 20 malic. Prazne malice se na spletni strani ne prikažejo.</p><div class="list" id="list"></div><button class="add" onclick="openModal()">＋ Dodaj malico</button><button class="save" onclick="save()">Shrani spremembe</button><span id="status" class="status"></span><div class="note">Razvojna različica: podatki so trenutno shranjeni v tem brskalniku. Naslednji korak je varen račun in centralna baza.</div></main><div class="modal" id="modal"><div class="box"><h2>Dodaj malico</h2><label>Naziv malice</label><input id="mn" placeholder="npr. Piščančji zrezek"><label>Opis / priloga</label><textarea id="md" placeholder="Pomfri, solata ..."></textarea><label>Cena</label><input id="mp" placeholder="8,90 €"><div class="actions"><button class="cancel" onclick="closeModal()">Prekliči</button><button class="save" onclick="addMeal()">Dodaj malico</button></div></div></div><script>
let data=[];try{data=(JSON.parse(localStorage.getItem('euroGurmanMeals'))||[]).filter(x=>x&&(x.name||x.desc||x.price)).slice(0,20)}catch(e){}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const l=document.getElementById('list');l.innerHTML='';data.forEach((x,i)=>l.insertAdjacentHTML('beforeend',`<div class="row"><input value="${esc(x.name)}" placeholder="Naziv" oninput="data[${i}].name=this.value"><input value="${esc(x.desc)}" placeholder="Opis / priloga" oninput="data[${i}].desc=this.value"><input value="${esc(x.price)}" placeholder="Cena" oninput="data[${i}].price=this.value"><button class="del" onclick="removeMeal(${i})">×</button></div>`));document.querySelector('.add').disabled=data.length>=20;document.querySelector('.add').textContent=data.length>=20?'Doseženo največ 20 malic':'＋ Dodaj malico'}
function openModal(){if(data.length>=20)return;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function addMeal(){const x={name:mn.value.trim(),desc:md.value.trim(),price:mp.value.trim()};if(!x.name&&!x.desc&&!x.price){closeModal();return}data.push(x);mn.value=md.value=mp.value='';closeModal();render()}
function removeMeal(i){data.splice(i,1);render()}
function save(){data=data.filter(x=>x.name||x.desc||x.price).slice(0,20);localStorage.setItem('euroGurmanMeals',JSON.stringify(data));status.textContent='✓ Shranjeno';setTimeout(()=>location.href='index.html#malice',500)}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};render();
</script></body></html>
